<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home.com</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #343a40;
            padding-top: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper {
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
        }
        .nav-link {
            color: #fff !important;
            padding: 15px 20px;
            border-bottom: 1px solid #495057;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #495057;
        }
        .user-dropdown {
            margin-top: auto; /* прижимает к низу */
            padding: 15px 20px;
            border-top: 1px solid #495057;
        }
        .dropdown-toggle {
            width: 100%;
            text-align: left;
            background-color: #49505700 !important;
            border: none;
            color: white !important;
        }
        .dropdown-toggle:hover {
            background-color: #5a6268 !important;
        }
        .dropdown-menu {
            background-color: #343a40;
            border: 1px solid #495057;
        }
        .dropdown-item {
            color: white !important;
        }
        .dropdown-item:hover {
            background-color: #495057 !important;
            color: white !important;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .content-wrapper {
                margin-left: 0;
            }
            .user-dropdown {
                margin-top: 20px;
                border-top: none;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="text-center mb-4">
            <h5 class="text-white">Aivova</h5>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="/home/">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/catalog/">Каталог</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/category/">Категории</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/contacts/">Контакты</a>
            </li>
        </ul>
        
        <div class="user-dropdown">
            <div class="dropdown">
                <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Пользователь
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="content-wrapper">
        <div class="container">
            <div class="text-center mb-5">
                <h1>Главная</h1>
                <p>Вы находитесь на сайте для продажи товаров.</p>
            </div>
            
            <div class="d-flex justify-content-center flex-wrap gap-4">  
                <div class="card text-center" style="width: 18rem;">
                    <div class="card-header">Товар 1</div>
                    <div class="card-body">
                        <p class="card-title h4">1000 руб</p>
                        <p class="card-text">Крутой товар</p>
                        <button type="button" class="btn btn-outline-primary">Купить!</button>
                    </div>
                </div>
                
                <div class="card text-center" style="width: 18rem;">
                    <div class="card-header">Товар 2</div>
                    <div class="card-body">
                        <p class="card-title h4">1200 руб</p>
                        <p class="card-text">Милый товар</p>
                        <button type="button" class="btn btn-outline-primary">Купить!</button>
                    </div>
                </div>
                
                <div class="card text-center" style="width: 18rem;">
                    <div class="card-header">Товар 3</div>
                    <div class="card-body">
                        <p class="card-title h4">100 руб</p>
                        <p class="card-text">Смешной товар</p>
                        <button type="button" class="btn btn-outline-primary">Купить!</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
